spring.application.name=facturation-api
server.port=8080

# --- MongoDB (remplace MySQL du TP1) ---
spring.data.mongodb.uri=mongodb://localhost:27017/facturation_db

# --- JWT (secret de 32 caracteres minimum) ---
app.jwt.secret=ChangeMoiParUnSecretTresLongEtAleatoire2026!
app.jwt.expiration-ms=7200000

# --- Origine autorisee du frontend React (Vite) ---
app.cors.allowed-origin=http://localhost:5173

# --- Messages d'erreur renvoyes au frontend ---
server.error.include-message=always
