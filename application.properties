spring.application.name=facturation-tp1
server.port=8080

# --- MySQL : adapter l'utilisateur et le mot de passe a votre installation ---
spring.datasource.url=jdbc:mysql://localhost:3306/facturation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate : cree et met a jour les tables automatiquement ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false
