<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client - Facturation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('clients')}"></div>
<main class="container">
    <h1>Gestion des clients</h1>
    <div class="card">
        <h2 th:text="${client.idClient == null} ? 'Nouveau client' : 'Modifier le client'">Nouveau client</h2>
        <form th:action="@{/clients/save}" th:object="${client}" method="post">
            <input type="hidden" th:field="*{idClient}">
            <div class="field half">
                <label for="nom">Nom</label>
                <input type="text" id="nom" th:field="*{nom}">
                <div class="field-error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
            </div>
            <div class="field half">
                <label for="tel">Téléphone</label>
                <input type="text" id="tel" th:field="*{tel}">
                <div class="field-error" th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}"></div>
            </div>
            <br>
            <button class="btn" type="submit">Enregistrer</button>
            <a class="btn secondary" th:href="@{/clients}">Annuler</a>
        </form>
    </div>
</main>
</body>
</html>
